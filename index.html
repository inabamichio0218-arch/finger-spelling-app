<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#304B32">
  <meta name="description" content="生成AIを活用した動画で、日本の指文字を学べる教材です。">
  <meta name="format-detection" content="telephone=no">
  <title>AI動画で学ぶ 指文字</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript>
    <p class="noscript">この教材を使うには、JavaScriptを有効にしてください。</p>
  </noscript>

  <main id="homeScreen" class="screen home-screen">
    <h1 class="app-title">
      <img src="images/title.png" alt="AI動画で学ぶ 指文字" width="1848" height="734">
    </h1>

    <nav class="kana-menu" aria-label="学習する指文字の行を選ぶ">
      <div class="kana-grid">
        <button class="kana-button" type="button" data-key="a" aria-label="あ行の動画を見る">
          <img src="images/btn-a.png" alt="" width="163" height="163">
        </button>
        <button class="kana-button" type="button" data-key="ka" aria-label="か行の動画を見る">
          <img src="images/btn-ka.png" alt="" width="162" height="163">
        </button>
        <button class="kana-button" type="button" data-key="sa" aria-label="さ行の動画を見る">
          <img src="images/btn-sa.png" alt="" width="163" height="163">
        </button>
        <button class="kana-button" type="button" data-key="ta" aria-label="た行の動画を見る">
          <img src="images/btn-ta.png" alt="" width="163" height="163">
        </button>
        <button class="kana-button" type="button" data-key="na" aria-label="な行の動画を見る">
          <img src="images/btn-na.png" alt="" width="162" height="163">
        </button>
        <button class="kana-button" type="button" data-key="ha" aria-label="は行の動画を見る">
          <img src="images/btn-ha.png" alt="" width="163" height="163">
        </button>
        <button class="kana-button" type="button" data-key="ma" aria-label="ま行の動画を見る">
          <img src="images/btn-ma.png" alt="" width="163" height="163">
        </button>
        <button class="kana-button" type="button" data-key="ya" aria-label="や行の動画を見る">
          <img src="images/btn-ya.png" alt="" width="162" height="163">
        </button>
        <button class="kana-button" type="button" data-key="ra" aria-label="ら行の動画を見る">
          <img src="images/btn-ra.png" alt="" width="163" height="163">
        </button>
      </div>

      <button class="kana-button other-button" type="button" data-key="other" aria-label="その他の指文字の動画を見る">
        <img src="images/btn-other.png" alt="" width="438" height="163">
      </button>
    </nav>

    <footer class="copyright">© 2026 Michio Inaba | I Love PowerPoint</footer>
  </main>

  <main id="playerScreen" class="screen player-screen" hidden>
    <header class="player-header">
      <button id="backButton" class="back-button" type="button" aria-label="トップ画面に戻る">
        <span aria-hidden="true">‹</span>
        <span>もどる</span>
      </button>
      <h2 id="videoHeading" class="video-heading">あ行</h2>
      <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <div class="video-stage">
      <video id="learningVideo" controls playsinline preload="metadata">
        お使いのブラウザーは動画再生に対応していません。
      </video>

      <div id="endActions" class="end-actions" hidden>
        <button id="replayButton" class="action-button" type="button">もう一度見る</button>
        <button id="homeButton" class="action-button action-button-secondary" type="button">トップにもどる</button>
      </div>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
